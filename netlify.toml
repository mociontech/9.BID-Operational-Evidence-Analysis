[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_PATHS = "public/analytics/config.js,dist/analytics/config.js"

[[headers]]
  for = "/analytics/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
